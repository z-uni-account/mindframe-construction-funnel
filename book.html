<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pick Your Time | Mindframe Media</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#080808" />
<!-- Always run full-screen: if this page ever loads inside an iframe, break out to the top window. -->
<script>if(window.top!==window.self){try{window.top.location.replace(window.location.href);}catch(e){}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--accent:#dc2626;--text:#f2f2f2;--muted:#8a8a8a;--border:#222}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:40px 20px 64px}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em;text-align:center;margin-bottom:28px}
  .brand b{color:var(--accent)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.25);
    padding:7px 15px;border-radius:100px}
  .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .head{text-align:center;margin-bottom:28px}
  .head h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:16px 0 10px;line-height:1.1}
  .head p{color:var(--muted);max-width:520px;margin:0 auto}
  .cal-card{background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.8),0 0 60px -20px rgba(220,38,38,.15)}
  .cal-card iframe{width:100%;border:none;display:block;min-height:760px}
  .foot{text-align:center;color:#555;font-size:12px;margin-top:26px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Mindframe<b>Media</b></div>
    <div class="head">
      <div class="eyebrow">Last step</div>
      <h1>Pick a time for your call</h1>
      <p>Choose a slot that works for you. You'll get a confirmation right away.</p>
    </div>
    <div class="cal-card">
      <iframe id="ghl-cal" src="https://api.leadconnectorhq.com/widget/booking/A1zzJxrPKW1feORjJg4r"
        scrolling="no" title="Book your call"></iframe>
    </div>
    <div class="foot">&copy; <span id="y">2026</span> Mindframe Media</div>
  </div>

  <!-- GHL auto-resize script (fits the calendar iframe to its content) -->
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    // Best-effort prefill: if the form passed name/email/phone in the URL, hand them to the calendar.
    (function(){
      var p = new URLSearchParams(location.search);
      var f = document.getElementById('ghl-cal');
      var map = {first_name:p.get('first_name'), last_name:p.get('last_name'),
                 name:p.get('name'), email:p.get('email'), phone:p.get('phone')};
      var extra = Object.keys(map).filter(function(k){return map[k];})
                    .map(function(k){return k+'='+encodeURIComponent(map[k]);}).join('&');
      if(extra){ f.src = f.src + (f.src.includes('?')?'&':'?') + extra; }
    })();
  </script>
</body>
</html>
